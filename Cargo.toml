[package]
name = "caprice"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
eframe = "0.36.2"
fontdb = "0.24.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
roxmltree = "0.21.1"
